name: Validate and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Lint PHP
        run: find . -type f -name '*.php' ! -name '*.blade.php' -print0 | xargs -0 -n1 php -l

      - name: Run regression tests
        run: php tests/run.php

      - name: Run updater self-test
        run: php bin/update.php --self-test

      - name: Test isolated updater activation and rollback
        run: |
          if [[ "${{ matrix.php }}" == "8.4" ]]; then
            php tests/updater-integration.php --linux-upgrades
          else
            php tests/updater-integration.php
          fi

      - name: Validate embedded JavaScript
        run: node tests/validate-js.mjs

      - name: Check whitespace
        run: git diff --check

  librenms-integration:
    name: LibreNMS 26.8 integration
    runs-on: ubuntu-24.04
    services:
      database:
        image: mariadb:11.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: librenms_phpunit_78hunjuybybh
          MYSQL_USER: librenms
          MYSQL_PASSWORD: librenms
        ports:
          - 3306
    steps:
      - name: Check out plugin source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin-source

      - name: Check out supported LibreNMS 26.8
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: librenms/librenms
          ref: 51344f722110350bb7301dde8b13bcf23ff65156
          path: librenms

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Configure LibreNMS test database
        working-directory: librenms
        env:
          DB_PORT: ${{ job.services.database.ports['3306'] }}
        run: |
          cat > .env <<EOF
          APP_KEY=base64:vHI+YHgkyCDad31iPEErGSNEOWO21wNzV+zyENKQv04=
          APP_URL=http://127.0.0.1:8000
          APP_ENV=testing
          APP_DEBUG=true
          DB_DRIVER=mysql
          DB_HOST=127.0.0.1
          DB_PORT=$DB_PORT
          DB_DATABASE=librenms_phpunit_78hunjuybybh
          DB_USERNAME=librenms
          DB_PASSWORD=librenms
          DB_TEST_DRIVER=mysql
          DB_TEST_HOST=127.0.0.1
          DB_TEST_PORT=$DB_PORT
          DB_TEST_DATABASE=librenms_phpunit_78hunjuybybh
          DB_TEST_USERNAME=librenms
          DB_TEST_PASSWORD=librenms
          EOF

      - name: Install LibreNMS dependencies
        working-directory: librenms
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install plugin and its integration test
        run: |
          mkdir -p librenms/app/Plugins/IdfDashboard/Support librenms/app/Plugins/IdfDashboard/resources/views
          cp plugin-source/Menu.php plugin-source/Page.php plugin-source/Settings.php librenms/app/Plugins/IdfDashboard/
          cp plugin-source/Support/*.php librenms/app/Plugins/IdfDashboard/Support/
          cp plugin-source/resources/views/*.blade.php librenms/app/Plugins/IdfDashboard/resources/views/
          mkdir -p librenms/tests/Feature/Plugins/IdfDashboard
          cp plugin-source/tests/librenms/DeviceAccessTest.php librenms/tests/Feature/Plugins/IdfDashboard/

      - name: Prepare and migrate LibreNMS test database
        working-directory: librenms
        env:
          DB_PORT: ${{ job.services.database.ports['3306'] }}
        run: |
          mysqladmin -h127.0.0.1 -P"$DB_PORT" --user=librenms --password=librenms ping --wait=10
          mysql -h127.0.0.1 -P"$DB_PORT" --user=librenms --password=librenms -e 'ALTER DATABASE librenms_phpunit_78hunjuybybh CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          sqlite3 database/testing.sqlite ""
          php artisan migrate --force

      - name: Run plugin integration tests against LibreNMS 26.8
        working-directory: librenms
        run: vendor/bin/phpunit tests/Feature/Plugins/IdfDashboard/DeviceAccessTest.php

  release:
    name: Publish verified package
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - librenms-integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.2'
          extensions: curl, zip
          coverage: none

      - name: Validate tag and source version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${TAG#v}"
          SOURCE_VERSION="$(php -r 'require "Support/Version.php"; echo App\Plugins\IdfDashboard\Support\Version::VERSION;')"
          test "$VERSION" = "$SOURCE_VERSION"

      - name: Build and validate release package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          export VERSION
          ARCHIVE="IdfDashboard-${TAG}.zip"
          mkdir -p dist/package/Support dist/package/resources/views dist/package/bin
          cp Menu.php Page.php Settings.php README.md CHANGELOG.md dist/package/
          SUPPORT_FILES=(
            Support/Config.php
            Support/DeviceAccess.php
            Support/ProblemPolicy.php
            Support/UpdateStatus.php
            Support/Version.php
          )
          if php -r 'exit(version_compare(getenv("VERSION"), "1.1.0", ">=") ? 0 : 1);'; then
            SUPPORT_FILES+=(
              Support/DeviceClassifier.php
              Support/Freshness.php
              Support/IssueBuilder.php
              Support/Severity.php
            )
          fi
          cp "${SUPPORT_FILES[@]}" dist/package/Support/
          cp resources/views/menu.blade.php resources/views/page.blade.php resources/views/settings.blade.php dist/package/resources/views/
          cp bin/update.php dist/package/bin/
          php -r 'require "bin/update.php"; (new IdfDashboardUpdater())->validateReleasePackage("dist/package", getenv("VERSION"));'
          (cd dist/package && zip -qr "../${ARCHIVE}" .)
          (cd dist && sha256sum "$ARCHIVE" > SHA256SUMS)
          unzip -t "dist/${ARCHIVE}"

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE="IdfDashboard-${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" "dist/${ARCHIVE}" dist/SHA256SUMS --verify-tag --title "IdfDashboard ${TAG}" --generate-notes
